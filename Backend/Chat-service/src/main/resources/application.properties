spring.application.name=Chat-service

server.port=8083

# indexing-service provides the repository status and the code search.
devpilot.indexing-service.base-url=http://localhost:8082

# Ollama runs the chat model on this PC.
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5-coder:1.5b

spring.ai.ollama.chat.options.temperature=0.1

spring.ai.ollama.init.pull-model-strategy=never