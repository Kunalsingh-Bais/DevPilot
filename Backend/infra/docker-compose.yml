name: devpilot

services:
  devpilot-db:
    image: pgvector/pgvector:pg16
    container_name: devpilot-db
    environment:
      POSTGRES_DB: devpilot
      POSTGRES_USER: devpilot
      POSTGRES_PASSWORD: devpilot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - devpilot-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  devpilot-db-data: