spring.application.name=Api-gateway

server.port=8095

# Route 0: Repository-service
spring.cloud.gateway.server.webmvc.routes[0].id=Repository-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/repos/**

# Route 1: Indexing-service
spring.cloud.gateway.server.webmvc.routes[1].id=Indexing-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/indexing/**

# Route 2: Chat-service
spring.cloud.gateway.server.webmvc.routes[2].id=Chat-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/chat/**

# Route 3: Auth-service
spring.cloud.gateway.server.webmvc.routes[3].id=Auth-service
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/auth/**

# Route 4: The GitHub callback goes to auth-service
spring.cloud.gateway.server.webmvc.routes[4].id=oauth-callback
spring.cloud.gateway.server.webmvc.routes[4].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/login/oauth2/**