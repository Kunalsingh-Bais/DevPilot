spring.application.name=Auth-service

server.port=8084

# Where the browser goes after a successful login. This is the Angular app.
devpilot.frontend-url=http://localhost:4200

# GitHub OAuth App credentials come from environment variables
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

# read:user only exposes the public profile (username, name, avatar).
spring.security.oauth2.client.registration.github.scope=read:user

# GitHub sends the user back to this address.
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:8095/login/oauth2/code/github