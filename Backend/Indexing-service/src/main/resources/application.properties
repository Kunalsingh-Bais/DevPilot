spring.application.name=Indexing-service

server.port=8082

# PostgreSQL database connection
spring.datasource.url=jdbc:postgresql://localhost:5433/devpilot
spring.datasource.username=devpilot
spring.datasource.password=devpilot

# JPA configuration
spring.jpa.hibernate.ddl-auto=none

# Address of repository-service.
devpilot.repository-service.base-url=http://localhost:8081

# Address of the Ollama server running
spring.ai.ollama.base-url=http://localhost:11434

# The model ude
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Never download models automatically at startup
spring.ai.ollama.init.pull-model-strategy=never