@if (auth.user(); as user) {
  <header class="border-b border-slate-800 bg-slate-950 text-slate-100">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-3">
        
      <span class="font-semibold">DevPilot</span>

      <div class="flex items-center gap-3 text-sm">
        <img [src]="user.avatarUrl" alt="" class="h-7 w-7 rounded-full" />

        <span>{{ user.login }}</span>
        <button type="button" (click)="signOut()"
            class="rounded-md border border-slate-700 px-3 py-1 hover:bg-slate-800">
          Logout
        </button>
      </div>
    </div>
  </header>  
}
  
<router-outlet></router-outlet>
